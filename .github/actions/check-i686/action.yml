name: "i686 checks"
description: "Cross-compile nss-rs and its tests for 32-bit x86 Linux (i686-unknown-linux-gnu)."

inputs:
  working-directory:
    description: "Working directory."
    default: "."
  github-token:
    description: "A Github PAT"
    required: true

runs:
  using: composite
  steps:
    - name: Install 32-bit host toolchain
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        [ "$APT_UPDATED" ] || sudo apt-get update && echo "APT_UPDATED=1" >> "$GITHUB_ENV"
        sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib

    - uses: mozilla/actions/rust@dbead646641c6d53d4d6f98beeb69f8fdec65513 # v2.0.4
      with:
        version: stable
        targets: i686-unknown-linux-gnu
        tools: cargo-hack
        token: ${{ inputs.github-token }}
        rust-cache: false

    - uses: ./install-nss
      with:
        target: i686-unknown-linux-gnu
        token: ${{ inputs.github-token }}

    - name: Compile tests (no-run)
      shell: bash
      env:
        WD: ${{ inputs.working-directory }}
      run: cd "$WD" && cargo hack --feature-powerset --exclude-features gecko,blapi test --no-run --target i686-unknown-linux-gnu
